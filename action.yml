name: 'NoRE exposure scan'
description: 'Grade the reverse-engineering exposure of a built web app and fail CI below a threshold.'
author: 'NoRE contributors'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  dir:
    description: 'Directory of built web assets to scan.'
    required: false
    default: 'dist'
  min-grade:
    description: 'Fail the job if the RE-exposure grade is below this (A–F). Empty = no grade gate.'
    required: false
    default: ''
  fail-on:
    description: 'Fail if any finding is at/above this severity (critical|high|medium|low). Gate on real risk.'
    required: false
    default: ''
  ignore:
    description: 'Comma-separated finding ids/categories to suppress (reviewed false positives).'
    required: false
    default: ''
  format:
    description: 'Output format: text | json | sarif.'
    required: false
    default: 'text'
  endpoint:
    description: 'Optional path to write a shields.io endpoint JSON (for a live badge).'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # Build nore from the action's own checkout, so it works without an npm release.
    - shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --no-audit --no-fund
        npm run build
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -e
        args=("${{ inputs.dir }}")
        [ -n "${{ inputs.min-grade }}" ] && args+=(--min "${{ inputs.min-grade }}")
        [ -n "${{ inputs.fail-on }}" ] && args+=(--fail-on "${{ inputs.fail-on }}")
        [ -n "${{ inputs.ignore }}" ] && args+=(--ignore "${{ inputs.ignore }}")
        [ -n "${{ inputs.format }}" ] && args+=(--format "${{ inputs.format }}")
        [ -n "${{ inputs.endpoint }}" ] && args+=(--endpoint "${{ inputs.endpoint }}")
        node "$GITHUB_ACTION_PATH/dist/cli.js" scan "${args[@]}"
